name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # Configure these as repository Actions variables (Settings →
      # Secrets and variables → Actions → Variables). The Zivid release
      # identifier includes a git-hash suffix (e.g. "2.17.2+90cfdc4b-1") and
      # changes with each Zivid SDK release — find the current value at
      # https://www.zivid.com/downloads.
      ZIVID_SDK_RELEASE: ${{ vars.ZIVID_SDK_RELEASE }}
      # URL of the Conan remote that hosts the viam-cpp-sdk recipe.
      VIAM_CONAN_REMOTE: ${{ vars.VIAM_CONAN_REMOTE }}
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check required variables
        run: |
          missing=()
          [[ -z "$ZIVID_SDK_RELEASE" ]] && missing+=("ZIVID_SDK_RELEASE")
          [[ -z "$VIAM_CONAN_REMOTE" ]] && missing+=("VIAM_CONAN_REMOTE")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing repository Actions variables: ${missing[*]}"
            echo "Configure them under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake python3 python3-pip curl

      - name: Install Zivid SDK
        run: |
          ARCH=$(dpkg --print-architecture)
          BASE_URL="https://downloads.zivid.com/sdk/releases"
          ZIVID_DEB="zivid_${ZIVID_SDK_RELEASE}_${ARCH}.deb"
          curl --fail --silent --show-error --location \
            "${BASE_URL}/${ZIVID_SDK_RELEASE}/u22/${ZIVID_DEB}" -o "${ZIVID_DEB}"
          sudo apt-get install -y --no-install-recommends "./${ZIVID_DEB}"

      - name: Install Conan
        run: |
          pip install --user 'conan>=2.0'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Conan remote
        run: |
          conan profile detect --force
          conan remote add viamrobotics "$VIAM_CONAN_REMOTE" --force

      - name: Build module.tar.gz
        run: make module.tar.gz

      - name: Verify build artifact
        run: |
          test -f module.tar.gz
          tar tzf module.tar.gz | sort
