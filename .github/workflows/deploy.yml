name: Deploy Module
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g. v0.0.1)
        required: true

permissions:
  contents: read

jobs:
  publish-module:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Build and upload to Viam Registry
        # viamrobotics/build-action@v1.7
        uses: viamrobotics/build-action@cd35d596eabba93e9b6776f708c54865ec1c8360
        with:
          version: ${{ inputs.version || github.ref_name }}
          ref: ${{ github.sha }}
          key-id: ${{ secrets.viam_key_id }}
          key-value: ${{ secrets.viam_key_secret }}
          token: ${{ github.token }}
